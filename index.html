<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meridian Workout – Today's Mission</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–black: #0a0a0a;
–white: #f5f2ee;
–gold: #c9a84c;
–red: #c0392b;
–muted: #888;
}

body {
background: var(–black);
color: var(–white);
font-family: ‘DM Sans’, sans-serif;
min-height: 100vh;
display: flex;
flex-direction: column;
align-items: center;
justify-content: flex-start;
padding: 40px 20px 60px;
overflow-x: hidden;
}

.badge {
font-family: ‘DM Sans’, sans-serif;
font-size: 11px;
letter-spacing: 4px;
text-transform: uppercase;
color: var(–gold);
border: 1px solid var(–gold);
padding: 5px 14px;
margin-bottom: 18px;
opacity: 0;
animation: fadeUp 0.6s 0.1s forwards;
}

h1 {
font-family: ‘Bebas Neue’, sans-serif;
font-size: clamp(52px, 10vw, 90px);
letter-spacing: 2px;
line-height: 1;
text-align: center;
margin-bottom: 6px;
opacity: 0;
animation: fadeUp 0.6s 0.25s forwards;
}

h1 span { color: var(–gold); }

.sub {
font-size: 13px;
color: var(–muted);
letter-spacing: 2px;
text-transform: uppercase;
margin-bottom: 48px;
opacity: 0;
animation: fadeUp 0.6s 0.4s forwards;
}

.choices {
display: flex;
gap: 20px;
flex-wrap: wrap;
justify-content: center;
margin-bottom: 50px;
opacity: 0;
animation: fadeUp 0.6s 0.55s forwards;
}

.btn {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 22px;
letter-spacing: 3px;
padding: 16px 42px;
border: 2px solid var(–white);
background: transparent;
color: var(–white);
cursor: pointer;
transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
position: relative;
overflow: hidden;
}

.btn::before {
content: ‘’;
position: absolute;
inset: 0;
background: var(–gold);
transform: scaleX(0);
transform-origin: left;
transition: transform 0.25s ease;
z-index: 0;
}

.btn:hover::before { transform: scaleX(1); }
.btn:hover { color: var(–black); border-color: var(–gold); transform: translateY(-2px); }
.btn span { position: relative; z-index: 1; }

.btn.active {
background: var(–gold);
border-color: var(–gold);
color: var(–black);
}

/* Result Area */
#result {
width: 100%;
max-width: 680px;
display: none;
flex-direction: column;
align-items: center;
gap: 28px;
animation: fadeUp 0.5s forwards;
}

#result.visible { display: flex; }

.result-label {
font-family: ‘Bebas Neue’, sans-serif;
font-size: 32px;
letter-spacing: 4px;
color: var(–gold);
text-align: center;
}

.caption {
font-size: 13px;
color: var(–muted);
letter-spacing: 1px;
text-align: center;
max-width: 420px;
line-height: 1.7;
}

/* SVG container */
.figure-wrap {
background: #111;
border: 1px solid #222;
padding: 30px 40px;
display: flex;
justify-content: center;
align-items: flex-end;
gap: 40px;
min-height: 280px;
width: 100%;
}

svg { overflow: visible; }

/* Divider */
.divider {
width: 60px;
height: 1px;
background: var(–gold);
opacity: 0.4;
}

@keyframes fadeUp {
from { opacity: 0; transform: translateY(18px); }
to   { opacity: 1; transform: translateY(0); }
}

@keyframes popIn {
0%   { transform: scale(0.8); opacity: 0; }
70%  { transform: scale(1.04); }
100% { transform: scale(1); opacity: 1; }
}

.pop { animation: popIn 0.45s ease forwards; }

/* pulse on arms */
@keyframes armPulse {
0%, 100% { transform: scale(1); }
50%       { transform: scale(1.06); }
}
</style>

</head>
<body>

<div class="badge">Meridian Spa · Eppendorf</div>
<h1>Today's<br><span>Workout</span></h1>
<p class="sub">Was wird's heute, Habibi?</p>

<div class="choices">
  <button class="btn" onclick="show('ganzkörper', this)"><span>💪 Ganzkörper</span></button>
  <button class="btn" onclick="show('arme', this)"><span>🦾 Nur Arme</span></button>
</div>

<div id="result">
  <div class="result-label" id="result-title"></div>
  <div class="divider"></div>
  <div class="figure-wrap" id="figure-wrap"></div>
  <p class="caption" id="result-caption"></p>
</div>

<script>
function show(mode, btn) {
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');

  const result = document.getElementById('result');
  const title  = document.getElementById('result-title');
  const wrap   = document.getElementById('figure-wrap');
  const cap    = document.getElementById('result-caption');

  result.classList.remove('visible');
  setTimeout(() => {
    if (mode === 'ganzkörper') {
      title.textContent = 'Ganzkörper-Modus';
      cap.textContent   = 'Überall ein bisschen praller. Arme, Brust, Bauch, Beine — alle kriegen ihr Fett weg. Im guten Sinne. Live long and lift heavy.';
      wrap.innerHTML    = fullBodySVG();
    } else {
      title.textContent = 'Arm-Tag (Göttermodus)';
      cap.textContent   = 'Der Rest? Irrelevant. Heute regieren nur die Arme. Curl til you hurl.';
      wrap.innerHTML    = armsSVG();
    }
    result.classList.add('visible');
  }, 80);
}

function fullBodySVG() {
  // Before: slim / After: full & stocky
  return `
  <div style="text-align:center; opacity:0.45; font-size:11px; letter-spacing:2px; color:#888; position:relative;">

      <!-- head -->
      <ellipse cx="45" cy="22" rx="16" ry="18" fill="#c9a07a"/>

      <!-- arms slim -->

    </svg>
    <div style="margin-top:8px">Vorher</div>

  <div style="color:var(--gold);font-family:'Bebas Neue',sans-serif;font-size:36px;align-self:center;padding-bottom:40px;">→</div>

  <div class="pop" style="text-align:center; font-size:11px; letter-spacing:2px; color:#c9a84c; position:relative;">
    <svg width="110" height="240" viewBox="0 0 110 240">
      <!-- head bigger -->

      <!-- neck thick -->
      <rect x="46" y="40" width="18" height="14" fill="#d4a97a" rx="3"/>
      <!-- torso wide & pumped -->
      <path d="M18 54 Q55 44 92 54 L85 132 Q55 140 25 132 Z" fill="#3a5068"/>
      <!-- chest bumps -->
      <ellipse cx="38" cy="76" rx="14" ry="10" fill="#4a6280" opacity="0.8"/>
      <ellipse cx="72" cy="76" rx="14" ry="10" fill="#4a6280" opacity="0.8"/>
      <!-- abs -->
      <rect x="45" y="94" width="10" height="8" rx="3" fill="#2e4560" opacity="0.7"/>
      <rect x="45" y="106" width="10" height="8" rx="3" fill="#2e4560" opacity="0.7"/>
      <!-- arms big -->
      <path d="M18 56 Q4 88 8 126" stroke="#d4a97a" stroke-width="17" fill="none" stroke-linecap="round"/>
      <path d="M92 56 Q106 88 102 126" stroke="#d4a97a" stroke-width="17" fill="none" stroke-linecap="round"/>
      <!-- bicep peak left -->
      <ellipse cx="10" cy="92" rx="10" ry="7" fill="#c9a07a" opacity="0.6"/>
      <!-- bicep peak right -->
      <ellipse cx="100" cy="92" rx="10" ry="7" fill="#c9a07a" opacity="0.6"/>
      <!-- legs thick -->
      <path d="M38 132 Q28 178 30 222" stroke="#2c3e50" stroke-width="20" fill="none" stroke-linecap="round"/>
      <path d="M72 132 Q82 178 80 222" stroke="#2c3e50" stroke-width="20" fill="none" stroke-linecap="round"/>
      <!-- quad bumps -->
      <ellipse cx="31" cy="165" rx="12" ry="8" fill="#374a5e" opacity="0.7"/>
      <ellipse cx="79" cy="165" rx="12" ry="8" fill="#374a5e" opacity="0.7"/>
    </svg>
    <div style="margin-top:8px; color:var(--gold);">Nachher ✦</div>
  </div>
  `;
}

function armsSVG() {
  return `

    <svg width="160" height="260" viewBox="0 0 160 260">
      <!-- head normal -->
      <ellipse cx="80" cy="24" rx="17" ry="19" fill="#d4a97a"/>
      <!-- neck -->
      <rect x="72" y="41" width="16" height="13" fill="#d4a97a" rx="2"/>
      <!-- torso (normal — er hat ja nur Arme trainiert) -->
      <path d="M48 54 Q80 48 112 54 L108 130 Q80 136 52 130 Z" fill="#3a5068"/>

      <ellipse cx="136" cy="100" rx="20" ry="14" fill="#c9905a"/>
      <ellipse cx="136" cy="100" rx="12" ry="8" fill="#e0a870" opacity="0.5"/>
      <!-- Tricep right -->
      <ellipse cx="144" cy="125" rx="13" ry="9" fill="#b8824a" opacity="0.7"/>
      <!-- forearm right huge -->
      <ellipse cx="148" cy="148" rx="12" ry="7" fill="#c9905a" opacity="0.8"/>

      <!-- Vein lines left arm -->
      <path d="M18 95 Q22 108 20 125" stroke="#8b4513" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M28 92 Q32 106 30 122" stroke="#8b4513" stroke-width="1" fill="none" opacity="0.5"/>
      <!-- Vein lines right arm -->
      <path d="M142 95 Q138 108 140 125" stroke="#8b4513" stroke-width="1.5" fill="none" opacity="0.6"/>
      <path d="M132 92 Q128 106 130 122" stroke="#8b4513" stroke-width="1" fill="none" opacity="0.5"/>

      <!-- legs normal (chicken legs energy) -->
      <path d="M62 130 Q55 175 56 222" stroke="#2c3e50" stroke-width="10" fill="none" stroke-linecap="round"/>
      <path d="M98 130 Q105 175 104 222" stroke="#2c3e50" stroke-width="10" fill="none" stroke-linecap="round"/>

      <!-- little question marks near legs -->
      <text x="38" y="190" fill="#555" font-size="18" font-family="serif">?</text>
      <text x="116" y="190" fill="#555" font-size="18" font-family="serif">?</text>
    </svg>
    <div style="margin-top:8px; color:var(--gold);">Peak Aesthetics™ 💪</div>
  </div>
  `;
}
</script>

</body>
</html>
```
